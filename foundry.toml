[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
# Scoped read access for the cross-check fixture built by the offchain package.
# Deliberately narrow: read-only, one directory, not the whole project.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
runs = 512
depth = 500
# Any handler revert fails the run. Without this a handler that always reverts
# lets the invariants pass while proving nothing.
fail_on_revert = true

[profile.fork]
eth_rpc_url = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
line_length = 110
