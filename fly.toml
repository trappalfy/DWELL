# Имя должно быть уникальным на всю Fly — поменяйте, если занято.
app = "dwell-protocol"
primary_region = "iad"

[build]

[env]
  # Всё, что здесь, попадает в git. Секретов тут нет и быть не может:
  # KEEPER_PRIVATE_KEY задаётся через fly secrets set и в конфиг не пишется.
  PORT = "8787"
  RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
  REWARD_VAULT = "0xEF84bAD4bBAdE5BECAe138Dd7c0CAA9dB6C77079"
  MIN_BALANCE = "100000"
  DATABASE_PATH = "/data/dwell.db"

  # Один прокси Fly перед процессом. Без этого лимит на выдачу челленджа
  # считался бы по адресу прокси — пять входов в минуту на всех сразу.
  TRUSTED_PROXY_HOPS = "1"

  # Снимается ровно строкой "false" и только осознанно. Пока стоит "true",
  # корни не публикуются и комиссии не свопаются.
  DRY_RUN = "true"

# База живёт на томе. Без него SQLite лёг бы на слой контейнера и исчезал
# при каждом деплое вместе со всеми начислениями после последнего корня.
[[mounts]]
  source = "dwell_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true

  # Три настройки, каждая из которых обязательна, и все по одной причине:
  # процесс должен быть РОВНО ОДИН и работать НЕПРЕРЫВНО.
  #
  # Воркер тикает раз в десять секунд и владеет журналом единолично:
  # идемпотентность сеттлмента держится на первичном ключе SQLite, а не на
  # блокировках. Вторая машина — это вторая база и две публикации на одну
  # эпоху. Остановленная машина — это пропущенные эпохи и бакеты, которые
  # к моменту пробуждения уже не заполнить честно.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    # /v1/config отвечает из памяти и не ходит в цепочку — проверка живости
    # не должна сама создавать нагрузку на RPC.
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/v1/config"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
